name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  lint:
    name: Lint, format, architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - run: make lint
      - run: make layers

  typecheck:
    name: mypy --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - run: make typecheck

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      # integration tests start PostgreSQL and Redis with testcontainers (Docker is available on the runner)
      - run: make cov
      - uses: actions/upload-artifact@v6
        if: matrix.python == '3.12'
        with:
          name: coverage
          path: coverage.xml

  contract:
    name: API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - name: openapi.json matches the code
        run: make openapi-check
      - name: No breaking changes against main
        if: github.event_name == 'pull_request'
        run: |
          if git show origin/${{ github.base_ref }}:openapi.json > /tmp/base-openapi.json 2>/dev/null; then
            docker run --rm -v /tmp:/base -v "$PWD":/head tufin/oasdiff breaking \
              /base/base-openapi.json /head/openapi.json --fail-on ERR
          else
            echo "no openapi.json on the base branch yet"
          fi

  e2e:
    name: Docker image + end-to-end smoke
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          tags: pcbis:dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start stack
        run: docker compose up -d --no-build --wait
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - name: Smoke test
        run: uv run python scripts/smoke.py --url http://localhost:8000
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down -v
