[project]
name = "pcb-inspection-service"
version = "0.1.0"
description = "Compare a PCB photo with a reference photo, report differences and collect operator feedback as a training dataset."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "PCB Inspection Service contributors" }]
keywords = ["pcb", "aoi", "inspection", "opencv", "computer-vision", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Manufacturing",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "alembic>=1.13",
    "boto3>=1.34",
    "celery[redis]>=5.4",
    "fastapi>=0.115",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pillow>=10.4",
    "prometheus-client>=0.20",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "redis>=5.0",
    "sqlalchemy>=2.0.32",
    "structlog>=24.4",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
pcbis = "pcb_inspection.cli.main:app"

[project.urls]
Homepage = "https://github.com/Cheburek28/PCBInspectionService"
Issues = "https://github.com/Cheburek28/PCBInspectionService/issues"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "httpx2>=2.13.1",
    "hypothesis>=6.112",
    "import-linter>=2.1",
    "moto[s3]>=5.0",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "testcontainers[postgres,redis]>=4.8",
    "types-boto3[s3]>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pcb_inspection"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "PT", "S", "PL", "TID"]
ignore = [
    "PLR0913",  # engine/services functions legitimately take many keyword arguments
    "PLR2004",  # numeric thresholds are named in params dataclasses
    "S101",     # assert is fine in tests and for type narrowing
    "N818",     # error names mirror HTTP semantics (NotFound, Unauthorized), not "...Error"
    "PLR0917",  # use cases take many explicit arguments; call sites use keywords where it helps
    "PLC0415",  # lazy imports are deliberate: CLI start-up time, optional boto3
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "N806"]
"src/pcb_inspection/engine/**" = ["N806"]  # matrix names like H, W follow math notation
"migrations/**" = ["E501"]
"scripts/**" = ["S603", "S607"]  # dev scripts call docker from PATH

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["pcb_inspection"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pcb_inspection.worker.*"]
disallow_untyped_decorators = false  # celery ships no type hints

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "testcontainers.*", "moto.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs Docker (Postgres / Redis via testcontainers)",
    "e2e: needs the running docker compose stack",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["pcb_inspection"]
branch = true
omit = ["src/pcb_inspection/worker/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.importlinter]
root_package = "pcb_inspection"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "pcb_inspection.cli",
    "pcb_inspection.api | pcb_inspection.worker",
    "pcb_inspection.services",
    "pcb_inspection.db | pcb_inspection.storage | pcb_inspection.queue",
    "pcb_inspection.domain",
    "pcb_inspection.engine",
]

[[tool.importlinter.contracts]]
name = "Engine is pure (no infrastructure)"
type = "forbidden"
source_modules = ["pcb_inspection.engine"]
forbidden_modules = ["sqlalchemy", "fastapi", "celery", "redis", "boto3", "pcb_inspection.settings"]
